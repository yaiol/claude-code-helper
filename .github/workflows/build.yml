name: Build

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # ⚠ CLAUDE: max-parallel:1 is REQUIRED, do not remove. With --publish always on a
      # parallel matrix, each OS job asks GitHub "is there a draft release for this tag?" at
      # the same instant, all see "no", and all CREATE their own draft (GitHub allows many
      # drafts per tag). Result: 3 duplicate drafts with the per-OS assets scattered across
      # them. Serializing makes job 1 create the one draft and jobs 2-3 find + append to it.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build & publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144

  # Rename the draft release from electron-builder's bare "1.0.0" to "<productName> <version>"
  # (= info.json app.name + app.version), e.g. "Claude Code Helper 1.0.0". Runs ONCE after the
  # whole matrix. ⚠ CLAUDE: look the release up by LISTING (it's a draft — GitHub's by-tag
  # endpoint skips drafts, so `gh release edit <tag>` can't find it), then PATCH its name.
  name-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set release title to "<productName> <version>"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          title="$(node -p "require('./package.json').productName") $version"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -n1)
          if [ -z "$id" ]; then echo "No release found for tag ${GITHUB_REF_NAME}"; exit 1; fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" -f name="$title"
          echo "Set release $id title to: $title"
