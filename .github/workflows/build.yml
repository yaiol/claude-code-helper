name: Build

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # ⚠ CLAUDE: max-parallel:1 is REQUIRED, do not remove. With --publish always on a
      # parallel matrix, each OS job asks GitHub "is there a draft release for this tag?" at
      # the same instant, all see "no", and all CREATE their own draft (GitHub allows many
      # drafts per tag). Result: 3 duplicate drafts with the per-OS assets scattered across
      # them. Serializing makes job 1 create the one draft and jobs 2-3 find + append to it.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build & publish
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
